<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/style.css">
    <title>HqVerse</title>

</head>

<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            HqVerse
        </a>
        <div class="d-flex gap-2 ms-auto">

            <a class="btn btn-outline-light btn-sm"
               href="/categorias"><i class="iconoir-list"></i>
                Categorias
            </a>
            <a class="btn btn-outline-light btn-sm"
               href="/obras"><i class="iconoir-book"></i>
                Obras
            </a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="text-warning mb-4">Cadastrar Obras</h1>
    <form th:action="@{/obras}" method="post" th:object="${obra}">
        <div class="mb-3">
            <input type="hidden" th:field="*{id}">
            <label class="form-label">Título</label>
            <input type="text" class="form-control"
                   required th:field="*{titulo}">
        </div>
        <div class="mb-3">
            <label class="form-label">Autor</label>
            <input type="text" class="form-control"
                   required th:field="*{autor}">
        </div>
        <div class="mb-3">
            <label class="form-label">Preço</label>
            <input type="number" step="0.01" class="form-control"
                   required th:field="*{preco}">
        </div>
        <button class="btn btn-warning" type="submit">Salvar</button>
    </form>
</main>
</body>
</html>
