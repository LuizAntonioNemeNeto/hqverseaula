<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/style.css">
    <title>HqVerse</title>

</head>

<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            HqVerse
        </a>
        <a class="btn btn-outline-light btn-sm"
           href="/categorias">
            Categorias
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between  align-items-center mb-4 ">
        <h1 class="text-warning">Categorias Cadastradas</h1>
        <a class="btn btn-warning" href="\categorias">+ Nova Categoria</a>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nome}"></td>
                <td th:text="${categoria.descricao}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="text-center">Não existe Registros</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
