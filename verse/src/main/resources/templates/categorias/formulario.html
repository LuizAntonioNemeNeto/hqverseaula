<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/style.css">
    <title>HqVerse</title>

</head>

<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            HqVerse
        </a>
        <a class="btn btn-outline-light btn-sm"
           href="/categorias">
            Categorias
        </a>
    </div>
</nav>

<main class="container py-5">
    <h1 class="text-warning mb-4">Cadastrar Categorias</h1>
    <form th:action="@{/categorias}" method="post" th:object="${categoria}">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control"
                   required th:field="*{nome}">
        </div>
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control"
                      required th:field="*{descricao}"></textarea>
        </div>
        <button class="btn btn-warning" type="submit">Salvar</button>
    </form>
</main>
</body>
</html>
